[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "rg-converters"
version = "2.1.2"
description = "Convert between some mobile rhythm game charting files! (C++ core with Python bindings)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPLv3" }
authors = [{ name = "YumYummity"}]
dependencies = []

[project.scripts]
rg-converters = "rg_converters.cli:main"

[tool.scikit-build]
wheel.packages = ["rg_converters"]
minimum-version = "build-system.requires"

# NOTE: without MSVC, build the extension with the MinGW-w64 g++ toolchain:
#   - `python build_ext.py`, which runs the known-good g++ recipe, OR
#   - configure CMake with a MinGW/Ninja toolchain (e.g. CMAKE_ARGS="-G Ninja -DCMAKE_CXX_COMPILER=g++").
