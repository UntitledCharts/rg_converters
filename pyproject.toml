[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "rg-converters"
dynamic = ["version"]
description = "Convert between some mobile rhythm game charting files! (C++ core with Python bindings)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPLv3" }
authors = [{ name = "YumYummity"}]
dependencies = []

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13"]

[project.scripts]
rg-converters = "rg_converters.cli:main"

[tool.scikit-build]
wheel.packages = ["rg_converters"]
minimum-version = "build-system.requires"
# single source of the version: rg_converters/version.py (CMake reads it for RG_VERSION too).
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "rg_converters/version.py"

# NOTE: without MSVC, build the extension with the MinGW-w64 g++ toolchain:
#   - `python build_ext.py`, which runs the known-good g++ recipe, OR
#   - configure CMake with a MinGW/Ninja toolchain (e.g. CMAKE_ARGS="-G Ninja -DCMAKE_CXX_COMPILER=g++").
