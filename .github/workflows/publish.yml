name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: {}   # allow manual runs to test the build without publishing

jobs:
  build_wheels:
    name: Wheels ${{ matrix.build }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Each OS is split into parallel jobs of two CPython versions (cpXYt = free-threaded).
        build: ["cp310-* cp311-*", "cp312-* cp313-*", "cp314-* cp314t-*", "cp315-* cp315t-*"]
    steps:
      - uses: actions/checkout@v5

      # Builds a binary wheel for each selected CPython on this OS, running the
      # scikit-build-core + CMake build (which vendors zlib via FetchContent, so no
      # system zlib is needed). The import test rejects a broken wheel before publish.
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.4
        with:
          extras: uv
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_SKIP: "*-win32 *_i686 *-musllinux*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_BUILD_VERBOSITY: "1"
          # std::to_chars (float) needs GCC >= 11, so use a newer manylinux image (default ships GCC 10).
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          # std::to_chars (float) on Apple libc++ is only available from macOS 13.3.
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=13.3"
          CIBW_TEST_REQUIRES: "pytest typer rich"
          # On free-threaded builds, importing must not switch the GIL back on.
          CIBW_TEST_COMMAND: >-
            python -c "import sys, sysconfig, rg_converters; print(rg_converters.__version__);
            assert not (sysconfig.get_config_var('Py_GIL_DISABLED') and sys._is_gil_enabled()), 'import re-enabled the GIL'"
            && pytest {project}/tests -q -p no:cacheprovider

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only publish for an actual release, never for a manual (workflow_dispatch) test run.
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/rg_converters
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
